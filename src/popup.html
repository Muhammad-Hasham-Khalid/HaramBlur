<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>HaramBlur Settings</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <header class="header">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </span>
                <h1>HaramBlur</h1>
            </div>
            <select id="language" aria-label="Language">
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="tr">Türkçe</option>
                <option value="ur">اردو</option>
            </select>
        </header>
        <section class="protection">
            <div>
                <label for="status" id="protection-label">Protection</label>
                <p class="status-copy">
                    <span class="status-dot" aria-hidden="true"></span
                    ><span id="protection-status" role="status"></span>
                </p>
            </div>
            <label class="switch">
                <input
                    id="status"
                    name="status"
                    type="checkbox"
                    role="switch"
                    aria-labelledby="protection-label"
                />
                <span class="slider"></span>
            </label>
        </section>
        <main id="container">
            <section class="site-card" id="whitelist-container">
                <span class="site-icon" aria-hidden="true"
                    ><svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                    >
                        <circle cx="12" cy="12" r="9" />
                        <ellipse cx="12" cy="12" rx="4" ry="9" />
                        <path d="M3 12h18" /></svg
                ></span>
                <div class="site-copy">
                    <label for="whitelist" id="website-name"></label>
                    <div id="whitelist-desc">
                        Detection is
                        <span id="whitelist-status-on" class="blue-text"
                            >On</span
                        ><span id="whitelist-status-off" class="red-text hidden"
                            >Off</span
                        >
                        for this website
                    </div>
                </div>
                <label class="switch">
                    <input
                        name="whitelist"
                        id="whitelist"
                        type="checkbox"
                        role="switch"
                        aria-labelledby="website-name"
                        aria-describedby="whitelist-desc"
                    />
                    <span class="slider"></span>
                </label>
            </section>
            <div class="section-heading">
                <h2 id="settings">Settings</h2>
                <span id="autosave">Saved automatically</span>
            </div>
            <div
                class="refresh-notice hidden"
                id="refresh-message"
                role="status"
            >
                Refresh the page to see the changes.
            </div>
            <section class="card">
                <div class="setting-row">
                    <div class="setting-copy">
                        <label for="blurryStart-mode" id="blurryStart"
                            >Blur media on load</label
                        >
                        <p class="tooltiptext" id="blurryStart-help">
                            Blur all media until detection starts.
                        </p>
                    </div>
                    <label class="switch">
                        <input
                            id="blurryStart-mode"
                            name="blurryStartMode"
                            type="checkbox"
                            role="switch"
                            aria-labelledby="blurryStart"
                            aria-describedby="blurryStart-help"
                        />
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="range-setting">
                    <label for="blur-amount" id="blurAmount"
                        >Blur amount
                        <span id="blur-amount-value">20%</span></label
                    >
                    <input
                        type="range"
                        id="blur-amount"
                        name="blurAmount"
                        min="10"
                        max="30"
                        value="20"
                        class="form-range"
                    />
                </div>
                <div class="setting-row compact">
                    <label for="grayscale-checkbox" id="grayscale"
                        >Grayscale</label
                    >
                    <label class="switch">
                        <input
                            type="checkbox"
                            name="gray"
                            id="grayscale-checkbox"
                            role="switch"
                            aria-labelledby="grayscale"
                        />
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="range-setting">
                    <label for="strictness-range" id="strictness"
                        >Strictness
                        <span id="strictness-value">50%</span></label
                    >
                    <input
                        type="range"
                        id="strictness-range"
                        name="strictness"
                        min="0.1"
                        max="1"
                        value="0.5"
                        step="0.1"
                        class="form-range"
                    />
                </div>
            </section>
            <section class="card choices-card">
                <fieldset>
                    <legend id="mediaToBlur">Media to blur</legend>
                    <div class="options-grid">
                        <label class="choice"
                            ><input type="checkbox" name="blurImages" /><span
                                id="blurImages"
                                >Images</span
                            ></label
                        >
                        <label class="choice"
                            ><input type="checkbox" name="blurVideos" /><span
                                id="blurVideos"
                                >Videos</span
                            ></label
                        >
                    </div>
                </fieldset>
                <fieldset>
                    <legend id="facesToBlur">Faces to blur</legend>
                    <div class="options-grid">
                        <label class="choice"
                            ><input type="checkbox" name="blurMale" /><span
                                id="blurMale"
                                >Male</span
                            ></label
                        >
                        <label class="choice"
                            ><input type="checkbox" name="blurFemale" /><span
                                id="blurFemale"
                                >Female</span
                            ></label
                        >
                    </div>
                </fieldset>
                <fieldset>
                    <legend id="unblurOnHover">Unblur on hover</legend>
                    <div class="options-grid">
                        <label class="choice"
                            ><input type="checkbox" name="unblurImages" /><span
                                id="unblurImages"
                                >Images</span
                            ></label
                        >
                        <label class="choice"
                            ><input type="checkbox" name="unblurVideos" /><span
                                id="unblurVideos"
                                >Videos</span
                            ></label
                        >
                    </div>
                </fieldset>
            </section>
        </main>
        <footer class="footer">
            <a
                href="https://github.com/alganzory/HaramBlur"
                target="_blank"
                rel="noopener noreferrer"
                >GitHub <span aria-hidden="true">↗</span></a
            >
            <a
                id="feedback-link"
                href="https://forms.gle/mDDjh44MKRVemWX86"
                target="_blank"
                rel="noopener noreferrer"
                >Feedback</a
            >
            <a
                class="support-link"
                href="https://www.buymeacoffee.com/alganzory"
                target="_blank"
                rel="noopener noreferrer"
                ><span class="support-text">Support the project</span>
                <span aria-hidden="true">♡</span></a
            >
        </footer>
        <script src="translations.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
